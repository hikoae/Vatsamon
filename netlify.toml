# Configurazione deploy Netlify (sito collegato a questo repo GitHub).
# La app sta in app/. Build con base "/" (Netlify serve dalla radice del dominio,
# a differenza di GitHub Pages che usa /vatsamon/). publish è relativo a base.
[build]
  base = "app"
  command = "npm run build -- --base=/"
  publish = "dist"
  # Guardrail crediti build: salta il deploy se il commit tocca solo documentazione.
  # Semantica Netlify INVERTITA: exit 0 = SALTA il build, exit != 0 = BUILDA.
  # Fail-safe: ref mancante/irrisolvibile, git in errore o diff vuoto → builda.
  # Gira dalla base "app": --no-relative e la pathspec ':/' forzano i path dalla radice
  # del repo, così netlify.toml, .github/ e firestore.rules fanno partire il build.
  # Su una riga sola: una eventuale troncatura a multiriga lascerebbe un exit 0 = SALTA.
  ignore = '''[ -n "$CACHED_COMMIT_REF" ] && [ -n "$COMMIT_REF" ] && git cat-file -e "$CACHED_COMMIT_REF^{commit}" 2>/dev/null || exit 1; changed=$(git diff --name-only --no-relative "$CACHED_COMMIT_REF" "$COMMIT_REF" -- ':/') || exit 1; [ -n "$changed" ] || exit 1; printf '%s\n' "$changed" | grep -qvE '(\.md$|(^|/)docs/|(^|/)LICENSE(\.(md|txt))?$)' && exit 1; exit 0'''

[build.environment]
  # Node 22 LTS: allineato all'ambiente di test/CI (Node 20 è in deprecazione).
  NODE_VERSION = "22"

# SPA fallback (tutte le rotte → index.html)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Header di sicurezza su ogni risposta (vale anche per /sw.js, quindi la CSP
# governa pure le fetch che il service worker fa per conto suo: vedi tile OSM).
[[headers]]
  for = "/*"
  [headers.values]
    # Niente MIME sniffing: un .json o una foto non possono essere eseguiti come script.
    X-Content-Type-Options = "nosniff"
    # Anti-clickjacking: nessuno incornicia la app (non la incorniciamo nemmeno noi).
    X-Frame-Options = "DENY"
    # Fuori origine esce solo l'origine, mai il path della rotta interna.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # camera = "Scatta la Reina" (ScattaView.tsx), geolocation = GPS della mappa
    # (App.tsx watchPosition): servono entrambe, ma solo a noi. Il resto negato —
    # la app non usa microfono, pagamenti, USB né sensori di movimento
    # (la Valutazione Reina è dichiaratamente solo-touch, niente DeviceMotion).
    Permissions-Policy = "camera=(self), geolocation=(self), microphone=(), payment=(), usb=(), browsing-topics=(), accelerometer=(), gyroscope=(), magnetometer=()"
    # CSP in Report-Only: gli host sono ricavati dal codice e dall'SDK Firebase
    # installato, ma la policy NON è stata eseguita in un browser su questo build.
    # In enforcing un solo host mancante renderebbe la app inutilizzabile, quindi
    # prima si osserva. Promuovere a "Content-Security-Policy" (stesso valore)
    # dopo aver verificato sul deploy reale, a console aperta: login Google,
    # mappa con i tile, Scatta la Reina, sync Firestore → zero violation.
    #   script-src : bundle nostri + apis.google.com/js/api.js e gstatic, caricati
    #                da signInWithPopup (nessuno script inline: injectRegister=false).
    #   style-src  : 'unsafe-inline' è obbligatorio, non pigrizia — i marker Leaflet
    #                sono divIcon con attributo style inline (App.tsx:127 e seguenti).
    #   connect-src: Firestore + Identity Toolkit/SecureToken (login), i tile OSM
    #                (li rifà il service worker → non basta img-src) e data: per la
    #                fetch della foto in canvas (App.tsx handleSighting).
    #   frame-src  : iframe __/auth/iframe del dominio Firebase + gapi/accounts.
    #   frame-ancestors non è applicato in Report-Only: a bloccare è X-Frame-Options.
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'self' data: https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://apis.google.com; frame-src https://*.firebaseapp.com https://apis.google.com https://accounts.google.com; worker-src 'self'; manifest-src 'self'"
    # NON aggiungere Cross-Origin-Opener-Policy = "same-origin": taglia
    # window.opener e rompe signInWithPopup (login Google).

# Unica regola di cache che serve: Netlify serve già tutto con
# "max-age=0, must-revalidate", quindi index.html, sw.js e i *_cache.json
# rivalidano da soli e gli aggiornamenti arrivano — vanno lasciati al default.
# Solo /assets/ ha il contenuto nel nome del file (hash Vite): a parità di nome
# non cambia mai, e può stare in cache un anno senza bloccare le nuove versioni.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
